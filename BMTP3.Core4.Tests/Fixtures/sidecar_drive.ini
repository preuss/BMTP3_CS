# Sidecar for one backup file.
# This INI file describes the source file, backup time, relative paths, and hashes.
# All dates in [Source] are dates from the source, not from the backup file in the destination.

# [Source] is the central section.
# It holds common source file information:
# source type, source identity, source file name, and all source dates.
[Source]
# Either MtpDevice or Drive.
SourceType=
# Stable identity for the source file, if available.
SourceId=
# The file name of the source file.
SourceFileName=
# The resolved media date for the source file.
# This is the date previously referred to as the resolved media datetime.
MediaTakenDateTime=
# Special source date commonly found in MTP device metadata.
# It may not correspond to any regular filesystem date.
AuthoredDateTime=
# Standard source filesystem dates.
CreateDateTime=
LastWriteDateTime=
LastAccessDateTime=

# SourceDrive is used only when SourceType=FileSystem. It contains drive information.
[SourceDrive]
DriveName=
VolumeLabel=
DriveFormat=

# Backup contains only the backup information that is useful per file.
[Backup]
BackupStartDateTime=

# Path describes relative paths, always including the file name. SourceRelativeFilePath is the original source-relative path. SanitizedSourceRelativeFilePath is the Windows-compatible version of the source path. TargetRelativeFilePath is the actual relative path in the destination used by this backup.
[Path]
SourceRelativeFilePath=
SanitizedSourceRelativeFilePath=
TargetRelativeFilePath=

# Hashes must always include all keys, even when a hash value is empty. This ensures a stable and predictable sidecar format.
[Hashes]
SHA3_512=
SHA3_512_FIPS202=
SHA3_512_KECCAK=
SHA2_512=
SHA2_256=
MD5=
BLAKE3_256=
BLAKE3_512=
