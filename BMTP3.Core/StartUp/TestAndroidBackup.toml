# Test Android (MTP) backup configuration
# Only backup "JPR-Galaxy A20e" (device) and "Phone" (storage/root) into
# C:\Priv.Test.Output\FullCopyAndroid\...

[default]
disabled = false
compare_by_binary = true
recursive = true
use_file_pattern = true
file_pattern = "${yyyy}\\${MM}\\${dd}\\${relativePath}\\${originalName}.${ext}"
file_pattern_if_exist = "${yyyy}\\${MM}\\${dd}\\${relativePath}\\${originalName}_${count}.${ext}"

###############################################################################
# (All drive_source entries removed – this config is now ONLY for Android MTP)
###############################################################################

###############################################################################
# DEVICE SOURCES
###############################################################################

# 1) Full recursive copy of the internal storage as exposed under the device name
[[device_source]]
enabled = false
title = "Galaxy A20e - Full Backup"
# The device name as reported by your enumeration
name = "JPR-Galaxy A20e"
# If you only want e.g. DCIM, change to: "JPR-Galaxy A20e/Phone/DCIM"
# Leaving just "JPR-Galaxy A20e/Phone" copies everything under internal storage.
folder_source = "JPR-Galaxy A20e/Phone"
folder_output = "C:\\Priv.Test.Output\\FullCopyAndroidGalaxy"
recursive = true
use_file_pattern = false
file_pattern = "${yyyy}\\${MM}\\${dd}\\${relativePath}\\${originalName}.${ext}"
file_pattern_if_exist = "${yyyy}\\${MM}\\${dd}\\${relativePath}\\${originalName}_${count}.${ext}"
compare_by_binary = true

# 2) (Optional) Some setups expose "Phone" directly as a separate logical device.
# Keep this only if your device enumeration lists a standalone device/storage named "Phone".
[[device_source]]
enabled = false
title = "Galaxy A20e - Pattern Backup"
name = "JPR-Galaxy A20e"
# Adjust to "Phone/DCIM" if you only want photos/videos.
folder_source = "Phone"
folder_output = "C:\\Priv.Test.Output\\FullCopyAndroidGalaxyPattern"
recursive = true
use_file_pattern = true
file_pattern = "${yyyy}\\${MM}\\${dd}\\${relativePath}\\${originalName}.${ext}"
file_pattern_if_exist = "${yyyy}\\${MM}\\${dd}\\${relativePath}\\${originalName}_${count}.${ext}"
compare_by_binary = true

# 3) (Optional) Some setups expose "Phone" directly as a separate logical device.
# Keep this only if your device enumeration lists a standalone device/storage named "Phone".
[[device_source]]
enabled = false
title = "Galaxy A20e - Pattern Count"
name = "JPR-Galaxy A20e"
# Adjust to "Phone/DCIM" if you only want photos/videos.
folder_source = "Phone"
folder_output = "C:\\Priv.Test.Output\\FullCopyAndroidGalaxyCount"
recursive = true
use_file_pattern = true
file_pattern = "${relativePath}\\${originalName}.${ext}"
file_pattern_if_exist = "${relativePath}\\${originalName}_${count}.${ext}"
compare_by_binary = true

# 4) (Optional) Some setups expose "Phone" directly as a separate logical device.
# Keep this only if your device enumeration lists a standalone device/storage named "Phone".
[[device_source]]
enabled = true
title = "Galaxy A20e - Flat Pattern Count"
name = "JPR-Galaxy A20e"
# Adjust to "Phone/DCIM" if you only want photos/videos.
folder_source = "Phone"
folder_output = "C:\\Priv.Test.Output\\FullCopyAndroidGalaxyFlatCount"
recursive = true
use_file_pattern = true
file_pattern = "${originalName}.${ext}"
file_pattern_if_exist = "${originalName}_${count}.${ext}"
compare_by_binary = true